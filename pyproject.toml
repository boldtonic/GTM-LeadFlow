[project]
name = "fogata"
version = "0.1.0"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # raise from in except (too noisy for existing code)
]

exclude = ["lead_finder.py", "config.py"]

[tool.ruff.lint.isort]
known-first-party = ["api_clients", "services", "utils", "models", "scoring", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
